<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ballpark · The Numbers Game</title>
<meta name="description" content="A party game of wild guesses, smart bets and crazy-but-true numbers. Best on a big screen.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;
  --ink:#F4F5FA; --muted:rgba(244,245,250,.64); --faint:rgba(244,245,250,.40);
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075); --glass3:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --acc:#8B7CFF; --acc2:#38E1D3; --gold:#FFD25E; --hot:#FF5A76; --mint:#3DF2AE;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --disp:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{font-size:clamp(14px, .95vw + .6vh, 30px)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
b{font-weight:700}

/* ---------- background: drifting aurora + faint grid ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 34s ease-in-out infinite alternate}
#bg .o1{background:#5B3DF5;top:-30vmax;left:-18vmax}
#bg .o2{background:#0EA5A4;bottom:-34vmax;right:-20vmax;animation-duration:41s;opacity:.32}
#bg .o3{background:#C026D3;top:30%;left:55%;width:40vmax;height:40vmax;opacity:.16;animation-duration:29s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
#bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:3.4rem 3.4rem;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%)}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{position:relative;z-index:2;height:100vh;overflow-y:auto;overflow-x:hidden}

.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 2.6rem 4.2rem;gap:1.25rem;animation:screenIn .6s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}}
.h1{font:700 2.5rem/1.08 var(--disp);letter-spacing:-.025em;text-align:center}
.sub{color:var(--muted);font-size:1.02rem;text-align:center;line-height:1.45}
.sub b{color:var(--ink)}
.btn-row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;align-items:center}
.label{font:600 .78rem 'Inter';letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* ---------- buttons ---------- */
.btn{font:600 1rem 'Inter';background:var(--glass2);border:1px solid var(--line2);border-radius:999px;padding:.72em 1.45em;cursor:pointer;transition:transform .2s var(--ease), background .2s, box-shadow .25s, opacity .3s;white-space:nowrap;backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-1px);background:var(--glass3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:#0a0a12;border-color:transparent;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 .9rem 2.4rem -.7rem rgba(139,124,255,.75)}
.btn.primary:hover{background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 1rem 2.8rem -.6rem rgba(139,124,255,.95)}
.btn.big{font-size:1.18rem;padding:.78em 1.7em}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--glass)}
.btn.sm{font-size:1.15rem;width:2.2em;height:2.2em;padding:0;display:grid;place-items:center}
.btn[disabled]{opacity:.3;pointer-events:none;box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.toggle:focus-visible,.ptile:focus-visible,.pav:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}

/* ---------- avatar tile (shared) ---------- */
.av{display:grid;place-items:center;border-radius:30%;background:radial-gradient(120% 120% at 30% 15%, color-mix(in srgb,var(--c) 50%, #1b1c28), color-mix(in srgb,var(--c) 16%, #0b0c14));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 80%, transparent), 0 .7rem 1.8rem -.7rem color-mix(in srgb,var(--c) 85%, transparent)}

/* ---------- title ---------- */
.kicker{display:inline-flex;align-items:center;gap:.6rem;padding:.4em 1em;border:1px solid var(--line2);border-radius:999px;background:var(--glass);font:600 .82rem 'Inter';letter-spacing:.16em;text-transform:uppercase;color:var(--muted);animation:fadeUp .8s .1s var(--ease) both}
.kicker i{width:.45rem;height:.45rem;border-radius:50%;background:var(--acc2);box-shadow:0 0 .8rem var(--acc2);font-style:normal}
.logo{font:700 clamp(4.5rem,12vw,12rem)/.92 var(--disp);letter-spacing:-.055em;background:linear-gradient(100deg,#fff 0%,#fff 42%,#c9c0ff 50%,#fff 58%,#fff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeUp 1s .2s var(--ease) both, shine 7s 1.4s ease-in-out infinite;padding:0 .05em}
.logo span{background:linear-gradient(160deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes shine{0%,60%{background-position:100% 0}100%{background-position:-60% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);filter:blur(8px)}}
.tagline{font:500 1.45rem var(--disp);text-align:center;color:var(--muted);letter-spacing:-.01em;animation:fadeUp .9s .45s var(--ease) both}
.tagline b{color:var(--ink);font-weight:600}
.title-emojis{display:flex;gap:.55rem;font-size:1.9rem;flex-wrap:wrap;justify-content:center;max-width:48rem}
.title-emojis span{animation:fadeUp .6s var(--ease) both, float 5s ease-in-out infinite;animation-delay:calc(.6s + var(--i)*.04s), calc(var(--i)*.3s)}
@keyframes float{50%{transform:translateY(-.3rem)}}
.foot-note{color:var(--faint);font-weight:500;font-size:.88rem;letter-spacing:.02em}
.title .btn-row{animation:fadeUp .8s .7s var(--ease) both}

/* ---------- setup ---------- */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,13rem));gap:.9rem;justify-content:center;width:100%}
.pcard{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:1.2rem;padding:.9rem .9rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.55rem;animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0)*.04s);transition:border-color .2s}
.pcard:focus-within{border-color:color-mix(in srgb,var(--c) 60%, transparent)}
.pav{width:4.2rem;height:4.2rem;border:none;font-size:2.4rem;cursor:pointer;position:relative;transition:transform .25s var(--spring)}
.pav:hover{transform:scale(1.07) rotate(-4deg)}
.pav-edit{position:absolute;right:-.35rem;bottom:-.35rem;background:#fff;color:#0a0a12;width:1.45rem;height:1.45rem;border-radius:50%;font-size:.72rem;display:grid;place-items:center;font-weight:800}
.pname{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem;color:#fff;font:600 1.1rem var(--disp);text-align:center;outline:none;transition:border-color .2s}
.pname:focus{border-color:var(--c)}
.pname::placeholder{color:rgba(255,255,255,.35)}
.pdel{position:absolute;top:.45rem;right:.55rem;background:none;border:none;color:var(--faint);font-size:.9rem;cursor:pointer}
.pdel:hover{color:var(--hot)}
.pcard.add{cursor:pointer;justify-content:center;border-style:dashed;border-color:var(--line2);min-height:8.4rem;color:var(--muted);font:600 1rem 'Inter';background:transparent;transition:background .2s, color .2s}
.pcard.add:hover{background:var(--glass);color:#fff}
.plus{font-size:2rem;line-height:1;font-weight:300}
.settings{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;align-items:stretch}
.set{background:var(--glass);border:1px solid var(--line);border-radius:1.1rem;padding:.85rem 1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;min-width:14rem}
.set-v{font:700 2.1rem var(--disp);min-width:2.4em;text-align:center;letter-spacing:-.02em}
.set-h{font-size:.8rem;color:var(--muted);text-align:center;max-width:16rem;line-height:1.4}
.stepper{display:flex;align-items:center;gap:.4rem}
.chips{display:flex;gap:.3rem;background:rgba(0,0,0,.3);padding:.25rem;border-radius:999px;border:1px solid var(--line)}
.chip{border:none;background:transparent;border-radius:999px;padding:.38em .8em;font-weight:600;font-size:.92rem;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.chip.on{background:#fff;color:#0a0a12}
.rules{align-items:stretch;gap:.45rem;min-width:19rem}
.rule{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-weight:600;font-size:.95rem}
.rule small{display:block;font-weight:400;color:var(--faint);font-size:.75rem}
.toggle{flex:none;width:3.1rem;height:1.75rem;border-radius:999px;border:none;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:background .25s}
.toggle span{position:absolute;top:.2rem;left:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 .1rem .3rem rgba(0,0,0,.4)}
.toggle.on{background:var(--acc)}
.toggle.on span{transform:translateX(1.35rem)}
.warn{color:var(--gold);font-weight:600}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:40;display:none}
#modal.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(4,4,10,.72);backdrop-filter:blur(10px);display:grid;place-items:center;padding:2rem;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(180deg,#14152200,#141522),#10111b;border:1px solid var(--line2);border-radius:1.6rem;padding:1.8rem 2rem;max-width:52rem;width:100%;max-height:92vh;overflow:auto;animation:modalIn .4s var(--ease) both;box-shadow:0 2rem 5rem rgba(0,0,0,.6)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.modal h2{font:700 1.9rem var(--disp);letter-spacing:-.02em;text-align:center;margin-bottom:1.2rem}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem}
.avopt{border:1px solid transparent;background:var(--glass);border-radius:1.1rem;padding:.75rem .4rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4rem;transition:transform .2s var(--ease), background .2s, border-color .2s}
.avopt .av{width:3.6rem;height:3.6rem;font-size:2.1rem}
.avopt small{font-weight:600;font-size:.82rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avopt:hover{transform:translateY(-2px);background:var(--glass2)}
.avopt.on{border-color:var(--acc2);background:rgba(56,225,211,.08)}
.avopt.taken{opacity:.28;cursor:not-allowed}
.howto ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:.6rem;font-size:1.08rem;line-height:1.45}
.howto li{counter-increment:s;display:flex;gap:.9rem;align-items:flex-start;background:var(--glass);border:1px solid var(--line);padding:.8rem 1rem;border-radius:1rem}
.howto li::before{content:counter(s);flex:none;width:1.9rem;height:1.9rem;border-radius:.6rem;background:#fff;color:#0a0a12;font:700 1rem/1.9rem var(--disp);text-align:center}
.howto .btn-row{margin-top:1.2rem}

/* ---------- game header ---------- */
.game{justify-content:flex-start;padding-top:1.2rem}
.ghdr{width:100%;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.round{font:600 1.35rem var(--disp);letter-spacing:-.01em}
.round small{color:var(--faint);font-weight:500;font-size:.8em}
.cat{display:inline-flex;align-items:center;gap:.5em;border:1px solid color-mix(in srgb,var(--c) 45%, transparent);background:color-mix(in srgb,var(--c) 12%, transparent);padding:.38em .9em;border-radius:999px;font-weight:600;font-size:.9rem;animation:fadeUp .5s .1s var(--ease) both}
.cat i{width:.5rem;height:.5rem;border-radius:50%;background:var(--c);box-shadow:0 0 .7rem var(--c)}
.bonus-chip{border:1px solid rgba(255,210,94,.5);background:rgba(255,210,94,.12);color:var(--gold);font-weight:700;font-size:.9rem;padding:.38em .9em;border-radius:999px;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 1.4rem rgba(255,210,94,.35)}}
.grow{flex:1}
.minis{display:flex;gap:.35rem;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:.3rem;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.12em .6em .12em .3em;font-size:1rem}
.mini b{font:600 .95rem var(--disp)}
.mini i{width:.4rem;height:.4rem;border-radius:50%;background:var(--c)}

/* ---------- question ---------- */
.q-wrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
.bonus-burst{font:700 1.5rem var(--disp);letter-spacing:.3em;text-transform:uppercase;background:linear-gradient(90deg,#FFE8A3,#FFC53D,#FF8A3D,#FFE8A3);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeUp .8s var(--ease) both, slide 3s linear infinite}
@keyframes slide{to{background-position:300% 0}}
.qcard{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--line2);border-radius:1.6rem;padding:2.6rem 3.2rem;max-width:66rem;width:100%;box-shadow:0 2rem 5rem -1.5rem rgba(0,0,0,.6);backdrop-filter:blur(14px);overflow:hidden;animation:cardIn .8s var(--ease) both}
.qcard::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.qcard::after{content:'';position:absolute;inset:-40% 30% auto;height:60%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 22%, transparent),transparent);pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.98)}}
.qtext{position:relative;font:600 2.75rem/1.2 var(--disp);letter-spacing:-.022em;text-align:center}
.qtext .w{display:inline-block;animation:wordIn .55s var(--ease) both;animation-delay:calc(.3s + var(--i)*.045s)}
@keyframes wordIn{from{opacity:0;transform:translateY(.35em);filter:blur(8px)}}
.q-bottom{display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap;justify-content:center}
.note-hint{display:flex;align-items:center;gap:.8rem;font-weight:600;font-size:1.12rem;background:var(--glass);border:1px solid var(--line2);padding:.6rem 1.2rem .6rem .6rem;border-radius:1rem;max-width:28rem;transition:border-color .3s, background .3s}
.note-hint .ic{flex:none;width:2.4rem;height:2.4rem;border-radius:.35rem .35rem .35rem .9rem;background:linear-gradient(160deg,#FFE97A,#FFC93C);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 .4rem 1rem -.3rem rgba(255,201,60,.6);transform:rotate(-4deg)}
.note-hint.done{border-color:rgba(255,90,118,.6);background:rgba(255,90,118,.1);animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.timer{position:relative;width:6rem;height:6rem;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.tr-bg{stroke:rgba(255,255,255,.08)}
.tr{stroke:var(--acc2);stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset 1s linear, stroke .3s;filter:drop-shadow(0 0 6px rgba(56,225,211,.6))}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font:600 2.1rem var(--disp);font-variant-numeric:tabular-nums}
.timer.low .tr{stroke:var(--hot);filter:drop-shadow(0 0 6px rgba(255,90,118,.7))}
.timer.low span{color:#ffb3c1;animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* ---------- bets ---------- */
.bet-title{font:700 3.2rem/1 var(--disp);letter-spacing:-.03em;text-align:center;animation:fadeUp .7s var(--ease) both}
.bet-title em{font-style:normal;background:linear-gradient(160deg,#FFE8A3,#FFB020);-webkit-background-clip:text;background-clip:text;color:transparent}
.qmini{font:500 1.35rem/1.35 var(--disp);color:var(--muted);text-align:center;max-width:56rem;animation:fadeUp .7s .1s var(--ease) both}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,17rem));gap:.9rem;justify-content:center;width:100%}
.step{background:var(--glass);border:1px solid var(--line);border-radius:1.2rem;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.35rem;animation:fadeUp .6s var(--ease) both;animation-delay:calc(.2s + var(--i)*.1s)}
.step .ico{font-size:1.9rem;line-height:1}
.step b{font:600 1.15rem var(--disp);letter-spacing:-.01em}
.step span{color:var(--muted);font-size:.92rem;line-height:1.4}

/* ---------- reveal ---------- */
.r-wrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;text-align:center}
.r-q{font:500 1.4rem/1.35 var(--disp);color:var(--muted);max-width:56rem;letter-spacing:-.01em}
.r-drum{font:600 2.6rem var(--disp);letter-spacing:-.02em;transition:opacity .3s, transform .3s}
.r-drum.gone{opacity:0;transform:scale(.9);height:0;margin:-.55rem 0;overflow:hidden}
.dots i{display:inline-block;font-style:normal;animation:dotJump 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotJump{40%{transform:translateY(-.25em);opacity:.5}}
.r-ans{display:none;flex-direction:column;align-items:center}
.r-ans.show{display:flex}
.r-about{font:600 1rem 'Inter';color:var(--acc2);letter-spacing:.32em;text-transform:uppercase;opacity:0;transition:opacity .4s}
.r-ans.landed .r-about{opacity:1}
.r-num{font:700 9rem/1 var(--disp);letter-spacing:-.045em;background:linear-gradient(180deg,#ffffff 30%,#c9c0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2.6rem rgba(139,124,255,.45));font-variant-numeric:tabular-nums;padding:0 .06em}
.r-ans.landed .r-num{animation:land .7s var(--spring)}
@keyframes land{35%{transform:scale(1.08)}}
.r-unit{font:500 1.8rem var(--disp);color:var(--ink);margin-top:.15rem;letter-spacing:-.01em}
.r-fact{display:flex;gap:1rem;align-items:center;background:var(--glass);border:1px solid var(--line2);border-radius:1.2rem;padding:1rem 1.4rem 1rem 1rem;max-width:58rem;font-size:1.32rem;font-weight:500;line-height:1.42;text-align:left;opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease), transform .6s var(--ease)}
.r-fact.show{opacity:1;transform:none}
.bulb{flex:none;width:3rem;height:3rem;border-radius:.9rem;background:rgba(255,210,94,.12);border:1px solid rgba(255,210,94,.35);display:grid;place-items:center;font-size:1.6rem}
.r-btn{opacity:0;pointer-events:none;transition:opacity .4s .3s}
.r-btn.show{opacity:1;pointer-events:auto}

/* ---------- pick winners ---------- */
.pick-wrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.15rem}
.stepchip{font:600 .78rem 'Inter';letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);border:1px solid rgba(56,225,211,.35);background:rgba(56,225,211,.07);padding:.35em .9em;border-radius:999px}
.pick-ans{font:600 1.45rem var(--disp);letter-spacing:-.01em;color:var(--muted)}
.pick-ans b{color:var(--ink);font-size:1.2em}
.pick-grid{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;max-width:72rem}
.ptile{width:10.6rem;border:1px solid var(--line);background:var(--glass);border-radius:1.3rem;padding:1.1rem .6rem .9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.5rem;position:relative;transition:transform .25s var(--spring), background .2s, border-color .2s, box-shadow .25s;animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i)*.04s)}
.ptile:hover{transform:translateY(-3px);background:var(--glass2)}
.pt-av{width:5rem;height:5rem;font-size:2.9rem}
.pt-n{font:600 1.2rem var(--disp);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-s{font-weight:500;color:var(--faint);font-size:.85rem}
.pt-s.tag{color:var(--acc2)}

.sc-head{display:flex;flex-direction:column;align-items:center;gap:.45rem}
.sc-who{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.sc-who span{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.32em .9em;font-weight:500;font-size:.95rem;color:var(--muted)}
.sc-who span b{color:var(--ink)}
.track{width:100%;max-width:84rem;display:flex;flex-direction:column;gap:.7rem;--rs:3.4rem}
.track.many{--rs:2.7rem;gap:.5rem}
.track.many .runner{font-size:1.6rem}
.lane{display:grid;grid-template-columns:12rem 1fr 8.5rem;align-items:center;gap:1rem;animation:slideIn .55s var(--ease) both;animation-delay:calc(var(--i)*.05s)}

.lane-name{display:flex;align-items:center;gap:.6rem;font:600 1.3rem var(--disp);min-width:0;letter-spacing:-.01em}

.rank{flex:none;width:1.8rem;height:1.8rem;border-radius:.55rem;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font:600 .9rem var(--disp)}
.rank.r1{background:var(--gold);color:#3a2600;border-color:transparent}
.road{position:relative;height:var(--rs);border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.road::after{content:'';position:absolute;left:1.4rem;right:2.4rem;top:50%;border-top:1px dashed rgba(255,255,255,.1)}

.runner{position:absolute;top:50%;left:calc((100% - var(--rs)) * var(--p));width:var(--rs);height:var(--rs);margin-top:calc(var(--rs) / -2);font-size:2rem;transition:left 1.6s var(--ease);z-index:2}
.runner.moving .r-e{animation:run .26s ease-in-out infinite}
@keyframes run{50%{transform:translateY(-.22rem) rotate(-8deg)}}
.crown{position:absolute;top:-1.35rem;font-size:1.35rem;animation:float 2s ease-in-out infinite}
.gain{position:absolute;top:-1.1rem;right:-2.3rem;background:var(--mint);color:#04261a;font:700 1rem var(--disp);padding:.05em .5em;border-radius:999px;animation:gainUp 1.4s .4s var(--spring) both;box-shadow:0 0 1rem rgba(61,242,174,.55)}

.lane-score{display:flex;align-items:center;justify-content:flex-end;gap:.5rem}
.lane-score b{font:700 2rem var(--disp);min-width:2.4rem;text-align:center;font-variant-numeric:tabular-nums}
.adj{width:1.7rem;height:1.7rem;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:700;opacity:.25;transition:opacity .2s, background .2s}

.lane.won .lane-name .nm{color:var(--mint)}

.pod-crown{position:absolute;top:-2.3rem;font-size:2.6rem}
.pod-n{font:600 1.4rem var(--disp);max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1 .pod-n{font-size:1.85rem;color:var(--gold)}

.pod.p2 .pod-block{height:6.8rem}
.pod.p3 .pod-block{height:5rem}
.others{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.other{display:flex;gap:.45rem;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.3em .9em .3em .5em;font-weight:500;font-size:1.02rem}

/* ---------- host bar ---------- */
#hostbar{position:fixed;right:1rem;bottom:1rem;z-index:30;display:flex;gap:.4rem;opacity:.3;transition:opacity .25s}
#hostbar:hover,#hostbar:focus-within{opacity:1}
#hostbar button{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line2);background:rgba(10,10,20,.6);backdrop-filter:blur(8px);cursor:pointer;font-size:1.05rem;display:grid;place-items:center}
#hostbar button:hover{background:var(--glass3)}
#hostbar button[hidden]{display:none}

@media (max-width:900px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps3{grid-template-columns:1fr}
  .lane{grid-template-columns:7rem 1fr 6rem}
  .avgrid{grid-template-columns:repeat(3,1fr)}
  .screen{padding:1.2rem 1rem 4.5rem}
}
/* ---------- TV friendliness ---------- */
/* Keep content inside the TV "safe area" — many sets crop 3–5% of each edge (overscan). */
.screen{padding:max(1.5rem,4vh) max(2.6rem,4.5vw) max(3.4rem,6vh)}
#app{scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.game{padding-top:max(1.2rem,4vh)}
#hostbar{right:max(1rem,3vw);bottom:max(1rem,3vh)}
body.idle, body.idle *{cursor:none!important}
/* 6–8 players: tighten setup + winner picker so everything fits one TV screen */
.screen.dense{gap:.8rem}
.dense .pick-wrap{gap:.8rem}
.dense .pcard{padding:.7rem .8rem .65rem;gap:.45rem}
.dense .pav{width:3.6rem;height:3.6rem;font-size:2.1rem}
.dense .pcard.add{min-height:7.2rem}
.dense .pick-grid{max-width:46rem}
.dense .ptile{width:10rem;padding:.75rem .5rem .65rem;gap:.35rem}
.dense .pt-av{width:3.8rem;height:3.8rem;font-size:2.2rem}
/* Older smart-TV browsers lack color-mix(): give them simple, solid fallbacks. */
@supports not (color: color-mix(in srgb, red 50%, blue)){
  .av{background:#1d1e2b;box-shadow:inset 0 0 0 2px var(--c)}
  .cat{border-color:var(--c);background:rgba(255,255,255,.05)}
  .pcard:focus-within{border-color:var(--c)}
  .ptile.on{border-color:var(--c);background:var(--glass2);box-shadow:0 0 0 2px var(--c)}
  .road-fill{background:var(--c);opacity:.3}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

/* =========================================================
   STATE
   ========================================================= */
const KEY = 'ballpark-v2';
const $ = s => document.querySelector(s);
const app = $('#app'), modal = $('#modal');
function fresh(){ return {screen:'title',players:[],target:22,targetTouched:false,timer:45,bonus:true,betting:true,noOver:true,order:[],pos:0,phase:'question',pickStep:'guess',sel:[],selBet:[],history:[],prev:{},gain:{},last:null,muted:false,gameOn:false,seen:[]}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && Array.isArray(s.players) ? Object.assign(fresh(), s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() || fresh();
S.screen = 'title';

const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const nm = p => (p.name || '').trim() || AV[p.av].n;
const fmt = n => Number(n).toLocaleString('en-US');
const dp = q => (String(q.a).split('.')[1] || '').length;
const fv = (q, v) => q.yr ? String(Math.round(v)) : Number(v).toLocaleString('en-US',{minimumFractionDigits:dp(q),maximumFractionDigits:dp(q)});
const curQ = () => QS[S.order[S.pos]];
const isBonus = () => S.bonus && (S.pos + 1) % 5 === 0;
const pts = () => isBonus() ? 2 : 1;
const byId = id => S.players.find(p => p.id === id);
const names = ids => ids.map(byId).filter(Boolean).map(p => esc(nm(p))).join(', ');
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const ranked = () => [...S.players].sort((a,b)=>b.score-a.score);
function checkWin(){
  const r = ranked(); if(!r.length) return null;
  const top = r[0].score;
  if(top >= S.target && (r.length < 2 || r[1].score < top)) return r[0];
  return null;
}
function tieAtTop(){ const r = ranked(); return r.length>1 && r[0].score >= S.target && r[1].score === r[0].score; }
// Leader's expected points per round: guess wins (~1 in n, leader a bit luckier) + correct bets.
function rate(n){ return 1/(0.45*n + 0.6) + (S.betting ? 0.6 : 0); }
const minsPerRound = () => S.betting ? 2.1 : 1.3;
function suggestTarget(n){ return Math.max(5, Math.min(40, Math.round(50 / minsPerRound() * rate(n)))); }
function estimate(){
  const n = Math.max(S.players.length, 2);
  const rounds = Math.round(S.target / rate(n));
  const mins = Math.round(rounds * minsPerRound() / 5) * 5;
  return {rounds, mins, over: rounds > QS.length};
}

/* =========================================================
   SOUND (tiny WebAudio synth — no files needed)
   ========================================================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f, d=.12, type='sine', vol=.15, when=0, slide=0){
  if(S.muted) return; const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
}
const SFX = {
  pop:   () => tone(520,.09,'triangle',.12,0,980),
  tick:  () => tone(1100,.04,'square',.035),
  beep:  () => tone(880,.12,'square',.06),
  buzz:  () => { tone(196,.5,'sawtooth',.08,0,150); tone(147,.5,'sawtooth',.05,.05,110); },
  drum:  () => { for(let i=0;i<16;i++) tone(110+i*7,.07,'triangle',.15,i*.07); },
  ding:  () => { [784,1047,1319].forEach((f,i)=>tone(f,.55,'sine',.15,i*.07)); },
  whoosh:() => tone(240,.35,'sawtooth',.03,0,1400),
  coin:  () => { tone(988,.08,'square',.06); tone(1319,.3,'square',.06,.08); },
  score: () => { [659,880,1175].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09)); },
  fanfare:() => { [523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i===7?.9:.2,'triangle',.14,[0,.15,.3,.45,.75,1.0,1.15,1.35][i])); },
  sad:   () => { [392,370,349].forEach((f,i)=>tone(f,.3,'triangle',.09,i*.25)); }
};

/* =========================================================
   CONFETTI
   ========================================================= */
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], fxOn = false; const dpr = Math.min(window.devicePixelRatio||1, 2);
const CONF = ['#FFD25E','#8B7CFF','#38E1D3','#FFFFFF','#FF5A76','#3DF2AE'];
function sizeFx(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
sizeFx(); addEventListener('resize', sizeFx);
function addPart(x,y,vx,vy){ parts.push({x,y,vx,vy,s:(6+Math.random()*8)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:CONF[Math.random()*CONF.length|0],sh:Math.random()<.65}); }
function burst(n=110, x=.5, y=.45){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(4+Math.random()*13)*dpr; addPart(x*cv.width, y*cv.height, Math.cos(a)*sp, Math.sin(a)*sp-8*dpr); } runFx(); }
function rain(ms=5000){ const end = Date.now()+ms; (function f(){ for(let i=0;i<6;i++) addPart(Math.random()*cv.width, -20*dpr, (Math.random()-.5)*4*dpr, (2+Math.random()*3)*dpr); runFx(); if(Date.now()<end && S.screen==='end') setTimeout(f, 70); })(); }
function runFx(){ if(fxOn) return; fxOn = true; requestAnimationFrame(fxTick); }
function fxTick(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){ p.vx*=.985; p.vy = Math.min(p.vy + .3*dpr, 7*dpr); p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
    if(p.sh){ cx.fillRect(-p.s/2,-p.s/5,p.s,p.s/2.5); } else { cx.beginPath(); cx.arc(0,0,p.s/2.8,0,Math.PI*2); cx.fill(); }
    cx.restore(); }
  parts = parts.filter(p => p.y < cv.height + 40*dpr);
  if(parts.length) requestAnimationFrame(fxTick); else { fxOn = false; cx.clearRect(0,0,cv.width,cv.height); }
}

let tmr = null, revealT = null, raf = null, revealDone = true, runT = null;
function stopTimers(){ clearInterval(tmr); tmr=null; clearTimeout(revealT); clearTimeout(runT); cancelAnimationFrame(raf); }

function render(){
  stopTimers();
  const v = S.screen==='title' ? vTitle() : S.screen==='setup' ? vSetup() : S.screen==='end' ? vEnd()
          : ({question:vQuestion, bet:vBet, reveal:vReveal, pick:vPick, scores:vScores})[S.phase]();
  app.innerHTML = v; app.scrollTop = 0;
  $('#hb-skip').hidden = !(S.screen==='game' && ['question','bet','reveal'].includes(S.phase));
  $('#hb-home').hidden = S.screen==='title';
  $('#hb-mute').textContent = S.muted ? '🔇' : '🔊';
  save();
  if(S.screen==='game' && S.phase==='question'){ markSeen(); SFX.whoosh(); if(isBonus()) setTimeout(()=>SFX.score(), 200); runTimer(S.timer, 1400, 'Pens down — stick your notes on the wall 📌'); }
  if(S.screen==='game' && S.phase==='bet'){ SFX.coin(); runTimer(betSecs(), 1200, 'Bets are locked 🔒'); }
  if(S.screen==='game' && S.phase==='reveal') runReveal();
  if(S.screen==='game' && S.phase==='scores') runScores();
  if(S.screen==='end'){ setTimeout(()=>{ SFX.fanfare(); burst(150,.5,.4); rain(6000); }, 900); }
}

function markSeen(){
  const i = S.order[S.pos]; if(i == null || S.seen.includes(i)) return;
  S.seen.push(i);
  if(S.seen.length >= QS.length) S.seen = [i]; // everything's been played — start a fresh cycle
  save();
}
const freshCount = () => QS.length - new Set(S.seen.filter(i=>i<QS.length)).size;

function runTimer(total, delay, doneMsg){
  if(!total) return;
  let left = total; const C = 276.46;
  revealT = setTimeout(()=>{
    tmr = setInterval(()=>{
      left--;
      const n = $('#tnum'), ring = $('#tring'), t = $('#timer'); if(!n) return stopTimers();
      ring.style.strokeDashoffset = C * (1 - left/total);
      n.textContent = Math.max(left,0);
      if(left <= 5 && left > 0){ t.classList.add('low'); SFX.beep(); }
      else if(left > 5 && left <= 10) SFX.tick();
      if(left <= 0){
        clearInterval(tmr); tmr = null; t.classList.remove('low'); n.textContent = '⏰';
        $('#hint').classList.add('done'); $('#hintTxt').textContent = doneMsg;
        SFX.buzz();
      }
    }, 1000);
  }, delay);
}

function runReveal(){
  const q = curQ(); revealDone = false;
  const final = fv(q, q.a), start = q.yr ? q.a - 150 : 0;
  $('#rnum').style.fontSize = Math.min(9, 60 / final.length) + 'rem';
  $('#rnum').textContent = fv(q, start);
  SFX.drum();
  revealT = setTimeout(()=>{
    $('#rdrum').classList.add('gone'); $('#rans').classList.add('show');
    const t0 = performance.now(), dur = 1700; let lastTick = 0;
    const step = t => {
      const k = Math.min((t - t0) / dur, 1), e = k === 1 ? 1 : 1 - Math.pow(2, -10*k);
      const v = start + (q.a - start) * e, f = Math.pow(10, dp(q));
      $('#rnum').textContent = fv(q, Math.round(v * f) / f);
      if(t - lastTick > 70 && k < 1){ SFX.tick(); lastTick = t; }
      if(k < 1) raf = requestAnimationFrame(step); else finishReveal();
    };
    raf = requestAnimationFrame(step);
  }, 1250);
}
function finishReveal(){
  if(revealDone) return; revealDone = true;
  clearTimeout(revealT); cancelAnimationFrame(raf);
  const q = curQ();
  $('#rdrum').classList.add('gone');
  $('#rans').classList.add('show','landed'); $('#rnum').textContent = fv(q, q.a);
  setTimeout(()=>{ $('#rfact') && $('#rfact').classList.add('show'); }, 350);
  $('#rbtn').classList.add('show');
  SFX.ding(); burst(80, .5, .42);
}

function runScores(){
  const gained = Object.keys(S.gain).length;
  if(gained) SFX.score(); else SFX.sad();
  runT = setTimeout(()=>{
    document.querySelectorAll('.road').forEach(road=>{
      const p = byId(road.dataset.pid); if(!p) return;
      const np = Math.min(p.score / S.target, 1);
      if(parseFloat(road.style.getPropertyValue('--p')) !== np){ road.querySelector('.runner').classList.add('moving'); }
      road.style.setProperty('--p', np);
    });
    runT = setTimeout(()=>{
      document.querySelectorAll('.runner.moving').forEach(r=>r.classList.remove('moving'));
      if(checkWin()){ burst(130,.5,.3); SFX.fanfare(); }
    }, 1650);
  }, 450);
  S.prev = {}; S.gain = {}; save(); // so a reload doesn't replay the animation
}

/* =========================================================
   ACTIONS
   ========================================================= */
function go(screen, phase){ S.screen = screen; if(phase) S.phase = phase; render(); }
function newPlayer(){
  const used = new Set(S.players.map(p=>p.av));
  const free = AV.map((_,i)=>i).filter(i=>!used.has(i));
  return {id: 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:'', av: free[Math.floor(Math.random()*free.length)], score:0};
}
function autoTarget(){ if(!S.targetTouched) S.target = suggestTarget(Math.max(S.players.length,2)); }
function nextQuestion(){ S.pos++; S.sel = []; S.selBet = []; S.pickStep = 'guess'; go('game','question'); }

const A = {
  setup(){ if(S.players.length===0){ S.players = [newPlayer(), newPlayer(), newPlayer()]; } autoTarget(); go('setup'); setTimeout(()=>{ const i = document.querySelector('.pname'); i && i.focus(); }, 80); },
  home(){ go('title'); },
  howto(){ openHowTo(); },
  resume(){ go('game'); },
  addPlayer(){ if(S.players.length>=8) return; S.players.push(newPlayer()); autoTarget(); SFX.pop(); render(); const ins = document.querySelectorAll('.pname'); ins[ins.length-1].focus(); },
  delPlayer(id){ S.players = S.players.filter(p=>p.id!==id); autoTarget(); render(); },
  pickAv(id){ openPicker(id); },
  target(d){ S.target = Math.max(3, Math.min(60, S.target + Number(d))); S.targetTouched = true; render(); },
  timer(v){ S.timer = Number(v); render(); },
  tog(k){ S[k] = !S[k]; if(k==='betting') autoTarget(); render(); },
  start(){
    if(S.players.length < 2) return;
    S.players.forEach(p=>{ p.score = 0; p.name = (p.name||'').trim(); });
    // Never repeat inside a game (it's one shuffled pass), and across games serve unseen questions first.
    const seen = new Set(S.seen);
    S.order = [...shuffle(QS.map((_,i)=>i).filter(i=>!seen.has(i))), ...shuffle([...seen].filter(i=>i<QS.length))]; S.pos = 0; S.sel = []; S.selBet = []; S.pickStep = 'guess';
    S.history = []; S.prev = {}; S.gain = {}; S.last = null; S.gameOn = true;
    ac(); go('game','question');
  },
  toBet(){ go('game','bet'); },
  reveal(){ go('game','reveal'); },
  toPick(){ if(!revealDone){ finishReveal(); return; } S.sel = []; S.selBet = []; S.pickStep = 'guess'; go('game','pick'); },
  toBets(){ if(!S.sel.length) return; S.pickStep = 'bet'; render(); },
  pickBack(){ S.pickStep = 'guess'; render(); },
  toggleSel(id, el){
    const k = S.pickStep === 'bet' ? 'selBet' : 'sel';
    S[k] = S[k].includes(id) ? S[k].filter(x=>x!==id) : [...S[k], id];
    const on = S[k].includes(id);
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
    const ab = $('#awardBtn'); if(ab) ab.disabled = !S.sel.length;
    const pb = app.querySelector('[data-a="award"][data-primary]'); if(pb && k==='selBet') pb.textContent = S.selBet.length ? 'Award points →' : 'Nobody bet on it →';
    if(on){ k==='selBet' ? SFX.coin() : SFX.pop(); const r = el.getBoundingClientRect(); burst(16, (r.left+r.width/2)/innerWidth, (r.top+r.height/3)/innerHeight); }
    save();
  },
  award(){
    if(!S.sel.length) return;
    const p = pts(), bets = S.betting ? S.selBet : [];
    S.prev = {}; S.gain = {};
    S.players.forEach(pl => S.prev[pl.id] = pl.score);
    [...S.sel, ...bets].forEach(id => { const pl = byId(id); if(pl){ pl.score += p; S.gain[id] = (S.gain[id]||0) + p; } });
    S.last = {guess:[...S.sel], bet:[...bets], p};
    S.history.push({pos:S.pos, gains:{...S.gain}, guess:[...S.sel], bet:[...bets]});
    go('game','scores');
  },
  noWinner(){ S.prev = {}; S.gain = {}; S.last = {guess:[],bet:[],p:0}; S.history.push({pos:S.pos, gains:{}, guess:[], bet:[]}); S.sel = []; S.selBet = []; go('game','scores'); },
  undo(){
    const h = S.history.pop(); if(!h) return;
    Object.entries(h.gains).forEach(([id,g]) => { const pl = byId(id); if(pl) pl.score = Math.max(0, pl.score - g); });
    S.pos = h.pos; S.sel = [...h.guess]; S.selBet = [...h.bet]; S.pickStep = 'guess'; S.prev = {}; S.gain = {};
    go('game','pick');
  },
  adj(v){ const [id, d] = v.split('|'); const p = byId(id); if(!p) return; p.score = Math.max(0, p.score + Number(d)); S.prev = {}; S.gain = {}; render(); },
  next(){
    if(checkWin() || S.pos + 1 >= S.order.length){ S.gameOn = false; go('end'); return; }
    nextQuestion();
  },
  rematch(){ A.start(); }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  ac(); const fn = A[b.dataset.a]; if(fn) fn(b.dataset.v, b);
  if(e.detail > 0 && b.tagName === 'BUTTON' && document.activeElement === b) b.blur(); // mouse clicks shouldn't steal the Space key
});
app.addEventListener('input', e => {
  const i = e.target.closest('.pname'); if(!i) return;
  const p = byId(i.dataset.pid); if(p){ p.name = i.value; save(); }
});
app.addEventListener('keydown', e => {
  if(e.target.classList && e.target.classList.contains('pname') && e.key === 'Enter'){
    e.preventDefault(); const ins = [...document.querySelectorAll('.pname')]; const k = ins.indexOf(e.target);
    if(k < ins.length-1) ins[k+1].focus(); else if(S.players.length < 8) A.addPlayer(); else e.target.blur();
  }
});

/* host bar */
$('#hostbar').addEventListener('click', e => {
  const b = e.target.closest('[data-h]'); if(!b) return; ac();
  const h = b.dataset.h;
  if(h==='mute'){ S.muted = !S.muted; b.textContent = S.muted ? '🔇' : '🔊'; save(); }
  if(h==='full') toggleFull();
  if(h==='home'){ if(S.screen==='game' || S.screen==='end' || S.screen==='setup') go('title'); }
  if(h==='skip' && S.screen==='game'){
    if(S.pos + 1 >= S.order.length){ S.gameOn = false; go('end'); } else nextQuestion();
  }
});
function toggleFull(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} }

/* keyboard: Space / Enter / → = main button, F = fullscreen, Esc closes popups */
document.addEventListener('keydown', e => {
  if(modal.classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
  const typing = e.target.matches && e.target.matches('input,textarea');
  if(typing) return;
  if(e.key==='f' || e.key==='F'){ toggleFull(); return; }
  if(e.key===' ' || e.key==='Enter' || e.key==='ArrowRight'){
    if(e.key!=='ArrowRight' && e.target.closest && e.target.closest('button') && !e.target.hasAttribute('data-primary')) return; // let focused buttons work normally
    const p = app.querySelector('[data-primary]');
    if(p && !p.disabled){ e.preventDefault(); ac(); const fn = A[p.dataset.a]; if(fn) fn(p.dataset.v, p); }
  }
});

/* =========================================================
   MODALS
   ========================================================= */
function closeModal(){ modal.classList.remove('open'); modal.innerHTML = ''; }
modal.addEventListener('click', e => {
  if(e.target.classList.contains('modal-bg')) return closeModal();
  const b = e.target.closest('[data-m]'); if(!b) return;
  if(b.dataset.m==='close') return closeModal();
  if(b.dataset.m==='av'){ const p = byId(modal.dataset.pid); if(p){ p.av = Number(b.dataset.v); SFX.pop(); } closeModal(); render(); }
});
function openPicker(pid){
  const p = byId(pid); if(!p) return; modal.dataset.pid = pid;
  modal.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-label="Choose an avatar"><h2>Choose your avatar</h2>
    <div class="avgrid">${AV.map((a,i)=>{ const owner = S.players.find(q=>q.av===i && q.id!==pid);
      return `<button class="avopt ${p.av===i?'on':''} ${owner?'taken':''}" data-m="av" data-v="${i}" ${owner?'disabled':''}><span class="av" style="--c:${a.c}">${a.e}</span><small>${owner?esc(nm(owner)):a.n}</small></button>`; }).join('')}</div></div></div>`;
  modal.classList.add('open');
}
function openHowTo(){
  modal.innerHTML = `<div class="modal-bg"><div class="modal howto" role="dialog" aria-label="How it works"><h2>How it works</h2>
    <ol>
      <li><span>A question pops up. Every answer is a <b>number</b>, and every fact is real.</span></li>
      <li><span>Everyone writes a guess <b>and their name</b> on a sticky note before the timer runs out.</span></li>
      <li><span>Stick the notes on the wall, lined up from smallest to biggest.</span></li>
      <li><span><b>Bet!</b> Each player puts a bet token on the guess they think will win. It can be their own guess or anyone else's. A second sticky note with your initials works great as a token.</span></li>
      <li><span>Reveal the answer. The guess that's <b>closest without going over</b> wins its writer a point, and <b>everyone who bet on it</b> wins a point too. If you bet on your own winning guess, you get both.</span></li>
      <li><span>Every 5th round is worth double. The first player to reach the target score wins.</span></li>
    </ol>
    <p class="sub" style="margin-top:1rem;font-size:.92rem">Host tips: press <b>Space</b> to move forward and <b>F</b> for full screen. Hover the bottom-right corner for sound, skip and menu. On the scoreboard, hover a row to fix a score with − / ＋. You can switch off betting or the no-going-over rule in setup.</p>
    <div class="btn-row"><button class="btn big primary" data-m="close">Got it</button></div></div></div>`;
  modal.classList.add('open');
}

/* =========================================================
   TV HELPERS
   ========================================================= */
// Keep the screen from dimming/sleeping during a game (supported in Chrome, Edge, Safari 16.4+).
let wakeLock = null;
async function keepAwake(){
  try{ if('wakeLock' in navigator && !wakeLock && document.visibilityState==='visible'){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepAwake(); });
document.addEventListener('click', keepAwake);
document.addEventListener('keydown', keepAwake);
// Hide the mouse pointer after 3 seconds of no movement so it isn't parked on the TV.
let idleT = null;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(()=>document.body.classList.add('idle'), 3000); }
['mousemove','mousedown','touchstart'].forEach(ev => document.addEventListener(ev, wake, {passive:true}));
wake();

render();
</script>
</body>
</html>
